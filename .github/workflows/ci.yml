name: source360-ci
on: [push, pull_request]
jobs:
  local:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: pip install -r requirements-dev.txt
      - run: python -m source360.generate --rows 100000
      - run: python -m source360.pipeline
      - run: pytest -q
      - run: python -m source360.export_demo
      - run: python -m powerbi.build_project
      - run: node --check web/app.js && node --check web/browser-engine.js && node --check web/ai-evidence.js
  postgres:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build
      - run: docker compose exec -T app python -m pytest -q
      - if: always()
        run: docker compose down
