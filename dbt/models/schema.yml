version: 2
models:
  - name: dim_supplier
    columns:
      - name: supplier_id
        tests: [unique, not_null]
  - name: fct_spend
    columns:
      - name: po_line_id
        tests: [unique, not_null]
      - name: supplier_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_supplier')
                field: supplier_id
      - name: extended_spend_usd
        tests: [not_null]
      - name: currency
        tests:
          - accepted_values:
              arguments:
                values: ['USD', 'EUR', 'GBP']
